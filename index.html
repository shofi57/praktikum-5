<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ruang Baca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #fffafd;
            min-height: 100vh;
        }

        .navbar {
            background: #198754;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 25px #00000026;
        }

        .login-header {
            padding: 24px 20px 8px;
            text-align: center;
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 600;
        }

        .login-header p {
            color: #888;
            font-size: 14px;
        }

        .login-body {
            padding: 12px 20px 20px;
        }

        .form-label {
            font-size: 14px;
        }

        .btn-login,
        .btn-login:hover {
            color: white;
        }

        .btn-login {
            background: #198754;
        }

        .btn-login:hover {
            background: #146c43;
        }

        .login-footer {
            padding: 18px;
            text-align: center;
            border-top: 1px solid #dee2e6;
        }

        .login-footer a {
            color: #198754;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menuNavbar"
                aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="#tentang">Tentang</a></li>
                    <li class="nav-item"><a class="nav-link" href="#bantuan">Bantuan</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Form Login -->
    <main class="container">
        <div class="row justify-content-center align-items-center py-5">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 d-flex justify-content-center">
                <div class="card login-card">

                    <div class="login-header">
                        <h2>Masuk ke Ruang Baca</h2>
                        <p>Temukan bacaan untuk hari ini.</p>
                    </div>

                    <div class="login-body">
                        <form action="#" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username"
                                    placeholder="Masukkan username" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="Masukkan password" required>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="ingatSaya">
                                <label class="form-check-label" for="ingatSaya">Ingat saya</label>
                            </div>

                            <button type="submit" class="btn btn-login w-100">Masuk</button>
                        </form>
                    </div>

                    <div class="login-footer">
                        <a href="#">Lupa password?</a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
